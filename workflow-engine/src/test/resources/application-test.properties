# Test-only properties — override main application.properties for unit / integration tests

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Async pool — small size for tests; keeps test run fast
async.executor.core-pool-size=1
async.executor.max-pool-size=2
async.executor.queue-capacity=10

# CORS — wide open for tests
app.cors.allowed-origins=*

# Suppress debug noise in tests
logging.level.com.halleyx.workflow_engine=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN
