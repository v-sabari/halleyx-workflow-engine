# ?????????????????????????????????????????
# APPLICATION NAME
# ?????????????????????????????????????????
spring.application.name=workflow-engine

# ?????????????????????????????????????????
# DATABASE (RAILWAY / RENDER ENV-BASED)
# ?????????????????????????????????????????
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?????????????????????????????????????????
# JPA / HIBERNATE
# ?????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# IMPORTANT:
# Hibernate auto-detects dialect in modern Spring Boot
# so DO NOT force MySQLDialect unless required

# ?????????????????????????????????????????
# SERVER
# ?????????????????????????????????????????
server.port=${PORT:8080}

# ?????????????????????????????????????????
# MAIL (GMAIL SMTP - ENV SAFE)
# ?????????????????????????????????????????
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ?????????????????????????????????????????
# JACKSON
# ?????????????????????????????????????????
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ?????????????????????????????????????????
# LOGGING
# ?????????????????????????????????????????
logging.level.com.halleyx.workflow_engine=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE