# =============================================================================
# APPLICATION
# =============================================================================
spring.application.name=workflow-engine

# =============================================================================
# DATABASE (inject via environment variables on Railway / Render / any PaaS)
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection-pool tuning (HikariCP defaults are sane; expose limits for env override)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =============================================================================
# JPA / HIBERNATE
# =============================================================================
spring.jpa.hibernate.ddl-auto=validate
# SECURITY: disable show-sql in production ? use an env var to enable in dev
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# =============================================================================
# STARTUP PERFORMANCE (Render free-tier CPU is throttled; boot was ~70s+)
# =============================================================================
# Defer bean creation until first use instead of eagerly wiring everything
# (all 8 JPA repos, security filters, services) before the app reports "started".
spring.main.lazy-initialization=true

# =============================================================================
# SERVER
# =============================================================================
server.port=${PORT:8080}
# Compression saves bandwidth on paginated JSON responses
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1024

# =============================================================================
# MAIL (Gmail SMTP ? inject credentials via env)
# =============================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =============================================================================
# JACKSON
# =============================================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# =============================================================================
# CORS (override in production)
# =============================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# =============================================================================
# LOGGING
# =============================================================================
# Application-level ? DEBUG in dev, INFO in prod (override via env LOG_LEVEL)
logging.level.com.halleyx.workflow_engine=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=WARN
# SQL logging ? a log LEVEL, not a boolean. ${SQL_LOG_LEVEL:WARN} so SQL statements
# are silent by default; set SQL_LOG_LEVEL=DEBUG locally to see generated queries.
# (Using ${SHOW_SQL:false} here is invalid: Spring's logging level binder requires
#  DEBUG/INFO/WARN/ERROR, not a boolean.)
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# =============================================================================
# ASYNC EXECUTOR (tune via environment variables)
# =============================================================================
async.executor.core-pool-size=${ASYNC_CORE_POOL_SIZE:4}
async.executor.max-pool-size=${ASYNC_MAX_POOL_SIZE:20}
async.executor.queue-capacity=${ASYNC_QUEUE_CAPACITY:500}
async.executor.keep-alive-seconds=${ASYNC_KEEP_ALIVE_SECONDS:60}

# =============================================================================
# SECURITY ? additional hardening headers
# =============================================================================
# X-Content-Type-Options, X-Frame-Options, HSTS etc. are set by Spring Security
# defaults when using the DSL. No extra config needed.

# =============================================================================
# ACTUATOR ? health probe for load balancers (no sensitive info exposed)
# =============================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never